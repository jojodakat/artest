<!doctype html>
<html>
    <head>
        <script src="vendor/aframe-1.0.4.min.js"></script>
        <script src="vendor/aframe-ar-3.4.7.js"></script>
        <script src="vendor/gesture-detector.js"></script>
        <script src="vendor/gesture-handler.js"></script>
        <style>
            #status {
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: 12px;
                z-index: 10;
                padding: 10px 12px;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.72);
                color: #fff;
                font: 14px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                pointer-events: none;
            }

            #startButton {
                position: fixed;
                left: 50%;
                top: 16px;
                z-index: 11;
                transform: translateX(-50%);
                padding: 10px 14px;
                border: 0;
                border-radius: 8px;
                background: #fff;
                color: #111;
                font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            #targetLink {
                position: fixed;
                right: 12px;
                top: 16px;
                z-index: 11;
                padding: 10px 12px;
                border-radius: 8px;
                background: rgba(255, 255, 255, 0.9);
                color: #111;
                font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                text-decoration: none;
            }
        </style>
        <script>
            function setStatus(message) {
                var status = document.querySelector("#status");
                if (status) status.textContent = message;
            }

            AFRAME.registerComponent('videohandler', {
                init: function () {
                    var marker = this.el;
                    this.vid = document.querySelector("#vid");

                    marker.addEventListener('markerFound', function () {
                        this.toggle = true;
                        setStatus("Marker found. Starting video...");
                        this.vid.play().then(function () {
                            setStatus("Marker found. Video playing.");
                        }).catch(function (error) {
                            setStatus("Marker found, but video is blocked. Tap Start AR.");
                            console.warn(error);
                        });
                    }.bind(this));

                    marker.addEventListener('markerLost', function () {
                        this.toggle = false;
                        this.vid.pause();
                        setStatus("Looking for marker...");
                    }.bind(this));
                },
            });

            window.addEventListener("camera-init", function () {
                setStatus("Camera ready. Point at the AR target.");
            });

            window.addEventListener("camera-error", function (event) {
                setStatus("Camera error: " + (event.error && event.error.message ? event.error.message : "camera unavailable"));
            });

            window.addEventListener("DOMContentLoaded", function () {
                var button = document.querySelector("#startButton");
                var video = document.querySelector("#vid");

                setStatus("Tap Start AR, then allow camera access.");

                button.addEventListener("click", function () {
                    video.play().then(function () {
                        video.pause();
                        video.currentTime = 0;
                        button.style.display = "none";
                        setStatus("Camera starting. Point at the AR target.");
                    }).catch(function () {
                        button.style.display = "none";
                        setStatus("Camera starting. Point at the AR target.");
                    });
                });
            });
        </script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <button id="startButton" type="button">Start AR</button>
        <a id="targetLink" href="target.html" target="_blank" rel="noopener">Target</a>
        <div id="status">Loading AR...</div>
        <a-scene
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs='sourceType: webcam; debugUIEnabled: false;'
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <video
                    id="vid"
                    src="assets/asset.mp4"
                    preload="auto"
                    response-type="arraybuffer"
                    loop
                    crossorigin
                    webkit-playsinline
                    autoplay
                    muted
                    playsinline
                ></video>
            </a-assets>

            <a-marker
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                videohandler
                smooth="true"
                smoothCount="10"
                smoothTolerance="0.01"
                smoothThreshold="5"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-video
                    src="#vid"
                    scale="1 1 1"
                    position="0 0.1 0"
                    rotation="-90 0 0"
                    class="clickable"
                    gesture-handler
                ></a-video>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>
    </body>
</html>
