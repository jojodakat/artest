<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AR Target</title>
        <style>
            :root {
                color-scheme: light;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #f4f4f4;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            main {
                width: min(86vmin, 720px);
                text-align: center;
            }

            .marker {
                box-sizing: border-box;
                width: 100%;
                aspect-ratio: 1;
                padding: 14%;
                background: #000;
            }

            .inner {
                box-sizing: border-box;
                width: 100%;
                height: 100%;
                display: grid;
                place-items: center;
                padding: 8%;
                background: #fff;
            }

            img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                image-rendering: pixelated;
            }

            p {
                margin: 16px 0 0;
                color: #222;
                font-size: 16px;
            }

            @media print {
                body {
                    background: #fff;
                }

                main {
                    width: 7in;
                }

                p {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="marker">
                <div class="inner">
                    <img src="assets/qr-code-trigger.png" alt="QR code AR target">
                </div>
            </div>
            <p>Scan this QR to open the AR page, then point the camera back at this square target.</p>
        </main>
    </body>
</html>
