<!doctype html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>AR Target</title>
        <style>
            :root {
                color-scheme: light;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #f4f4f4;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            }

            main {
                width: min(92vmin, 820px);
                text-align: center;
            }

            .marker {
                width: 100%;
                background: #000;
            }

            img {
                display: block;
                width: 100%;
            }

            p {
                margin: 16px 0 0;
                color: #222;
                font-size: 16px;
            }

            @media print {
                body {
                    background: #fff;
                }

                main {
                    width: 7.5in;
                }

                p {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="marker">
                <img src="assets/ar-target.png" alt="Globe AR target">
            </div>
            <p>This is the AR target. Open the AR webpage on your phone, then point the camera at this image.</p>
        </main>
    </body>
</html>
